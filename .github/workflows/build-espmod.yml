name: build-espmod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show source tree
        run: |
          echo "--- tracked sources ---"
          git ls-files | grep -iE '\.(cpp|cc|h|hpp)$|CMakeLists' || true
          echo "--- src/ ---"
          ls -la src || echo "src/ does not exist"

      - name: Patch CMakeLists (replace hardcoded src/main.cpp with glob)
        run: |
          python3 - <<'PY'
          import re, sys
          path = "CMakeLists.txt"
          text = open(path, encoding="utf-8").read()
          if "ESPMOD_SOURCES" in text:
              print("Already patched")
              sys.exit(0)
          m = re.search(r"add_library\(\s*espmod\s+(SHARED|STATIC|MODULE)?[^)]*\)", text, re.S)
          if not m:
              print("ERROR: add_library(espmod ...) not found")
              sys.exit(2)
          libtype = m.group(1) or "SHARED"
          block = (
              "file(GLOB ESPMOD_SOURCES CONFIGURE_DEPENDS\n"
              "    \"${CMAKE_CURRENT_SOURCE_DIR}/src/*.cpp\"\n"
              "    \"${CMAKE_CURRENT_SOURCE_DIR}/*.cpp\")\n"
              "if(NOT ESPMOD_SOURCES)\n"
              "    file(GLOB_RECURSE ESPMOD_FOUND \"${CMAKE_CURRENT_SOURCE_DIR}/*.cpp\")\n"
              "    message(FATAL_ERROR \"espmod: no sources found. .cpp under ${CMAKE_CURRENT_SOURCE_DIR}: ${ESPMOD_FOUND}\")\n"
              "endif()\n"
              "message(STATUS \"espmod sources: ${ESPMOD_SOURCES}\")\n"
              "add_library(espmod " + libtype + " ${ESPMOD_SOURCES})"
          )
          open(path, "w", encoding="utf-8").write(text[:m.start()] + block + text[m.end():])
          print("Patched, library type:", libtype)
          PY

      - name: Configure
        run: |
          # Assumption (reversible): arm64-v8a, android-24. Change if the target needs otherwise.
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Locate artifact
        run: find build -name 'libespmod*.so' -print

      - uses: actions/upload-artifact@v4
        with:
          name: espmod
          path: build/**/libespmod*.so
          if-no-files-found: error
concurrency: 
