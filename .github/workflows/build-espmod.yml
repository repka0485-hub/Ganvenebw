name: build-espmod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ABI: arm64-v8a
  ANDROID_API: "24"          # assumption: minimum API; binary needs GLES3 (API 18+). Change if the project sets another.
  CMAKE_TARGET: espmod       # FILL: CMake target producing libespmod.so (sources were not provided; confirm in CMakeLists.txt)
  IMGUI_REV: 97428e8ac99e339ce05eee531cf55b77b29ea709   # v1.91.9, from third-party-revisions.txt
  DOBBY_REV: 5dfc8546954ce3b3198132ab13fddb89ee92cdd7   # from third-party-revisions.txt

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned third-party sources
        run: |
          set -euo pipefail
          fetch() { # url rev dest
            rm -rf "$3"; git init -q "$3"
            git -C "$3" remote add origin "$1"
            git -C "$3" fetch -q --depth 1 origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
            test "$(git -C "$3" rev-parse HEAD)" = "$2"
          }
          fetch https://github.com/ocornut/imgui.git "$IMGUI_REV" third_party/imgui
          fetch https://github.com/jmpews/Dobby.git  "$DOBBY_REV" third_party/Dobby
          grep -q '"1.91.9"' third_party/imgui/imgui.h

      - name: Configure
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?no NDK on runner}}"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          grep -m1 Pkg.Revision "$NDK/source.properties" | tee ndk-revision.txt
          cmake -S . -B out -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build out --target "$CMAKE_TARGET" -j"$(nproc)"

      - name: Verify library
        run: |
          set -euo pipefail
          LIB="$(find out -name libespmod.so -print -quit)"
          test -n "$LIB"
          echo "LIB=$LIB" >> "$GITHUB_ENV"
          READELF="$(ls "$NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)"
          "$READELF" -h "$LIB" | grep -q 'Machine:.*AArch64'
          "$READELF" -d "$LIB" | grep -q 'SONAME.*libespmod.so'
          # only system libs may be NEEDED (no libc++_shared.so)
          bad="$("$READELF" -d "$LIB" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | grep -vxE 'liblog.so|libEGL.so|libGLESv3.so|libandroid.so|libdl.so|libm.so|libc.so' || true)"
          test -z "$bad" || { echo "unexpected NEEDED: $bad"; exit 1; }

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/build
          cp "$LIB" dist/build/libespmod.so
          SHA="$(sha256sum dist/build/libespmod.so | cut -d' ' -f1)"
          echo "$SHA  build/libespmod.so" > dist/build/libespmod.so.sha256
          printf 'imgui %s (v1.91.9)\nDobby %s (%s)\n' "$IMGUI_REV" "$DOBBY_REV" "$DOBBY_REV" > dist/third-party-revisions.txt
          cp ndk-revision.txt dist/ndk-revision.txt
          sed "s/^LIB_SHA256=\"\"\$/LIB_SHA256=\"$SHA\"/" tools/inject.sh > dist/inject.sh
          chmod +x dist/inject.sh
          sh -n dist/inject.sh
          grep -q "^LIB_SHA256=\"$SHA\"\$" dist/inject.sh
          ls -l dist dist/build

      - uses: actions/upload-artifact@v4
        with:
          name: espmod-arm64-v8a
          path: dist/
          if-no-files-found: error
